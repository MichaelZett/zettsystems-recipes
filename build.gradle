plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version "${vanniktechPublishVersion}"
    id 'io.github.ben-manes.versions' version "${benManesVersionsVersion}"
}

repositories {
    mavenCentral()
}

// `group` and `version` come from gradle.properties
description = 'OpenRewrite recipes from ZettSystems.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation platform("org.openrewrite.recipe:rewrite-recipe-bom:${rewriteRecipeBomVersion}")
    implementation 'org.openrewrite:rewrite-java'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation('org.openrewrite:rewrite-test') {
        exclude group: 'org.slf4j', module: 'slf4j-nop'
    }
    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"

    // Parsers for the Java versions the test fixtures are written in.
    testRuntimeOnly 'org.openrewrite:rewrite-java-17'
    testRuntimeOnly 'org.openrewrite:rewrite-java-21'
    testRuntimeOnly 'org.openrewrite:rewrite-java-25'

    // An SLF4J binding, so parser warnings become visible while testing.
    testRuntimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testRuntimeOnly "com.google.guava:guava:${guavaVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
    metaInf {
        from(file('LICENSE'))
    }
}

// The recipe is compiled against Java 17 so that it can be loaded by any build
// running on JDK 17 or newer. Only the tests use the full Java 25 language level.
tasks.named('compileJava') {
    options.release = 17
}

// ------------------------------------------------------ dependency updates

def depUpdateIsUnstable = { String version ->
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    def stable = stableKeywords.any { version.toUpperCase().contains(it) }
    def numericLooking = version ==~ /^[0-9,.v-]+(-r)?$/
    return !stable && !numericLooking
}
def depUpdateIsMajorBump = { String current, String candidate ->
    def cur = current.split(/[.\-]/, 2)[0]
    def cand = candidate.split(/[.\-]/, 2)[0]
    return cur.isInteger() && cand.isInteger() && cand.toInteger() > cur.toInteger()
}
dependencyUpdates {
    rejectVersionIf { selection ->
        def allowUnstable = project.hasProperty('unstable')
        def allowMajor = project.hasProperty('major')
        if (!allowUnstable
                && depUpdateIsUnstable(selection.candidate.version)
                && !depUpdateIsUnstable(selection.currentVersion)) {
            return true
        }
        if (!allowMajor
                && depUpdateIsMajorBump(selection.currentVersion, selection.candidate.version)) {
            return true
        }
        return false
    }
}

// ------------------------------------------------------ sign & publish

// Locally the GPG agent holds the key; CI hands the key in through
// `signingInMemoryKey`, which the publish plugin wires up on its own.
if (!project.hasProperty('signingInMemoryKey')) {
    signing {
        useGpgCmd()
    }
}

mavenPublishing {
    // Uploads to the Central Portal (https://central.sonatype.com). The bundle is
    // only validated, never released automatically — release it by hand in the
    // portal, or run `publishAndReleaseToMavenCentral` once that is trusted.
    publishToMavenCentral()
    signAllPublications()

    coordinates(group.toString(), 'zettsystems-recipes', version.toString())

    pom {
        name = 'zettsystems-recipes'
        description = project.description
        url = 'https://github.com/MichaelZett/zettsystems-recipes'
        inceptionYear = '2023'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'michaelzett'
                name = 'Michael Zoeller'
                email = 'michael2.zoeller@gmail.com'
                organization = 'ZettSystems'
                organizationUrl = 'https://zettsystems.de/'
            }
        }
        scm {
            url = 'https://github.com/MichaelZett/zettsystems-recipes'
            connection = 'scm:git:https://github.com/MichaelZett/zettsystems-recipes.git'
            developerConnection = 'scm:git:ssh://git@github.com/MichaelZett/zettsystems-recipes.git'
        }
        issueManagement {
            system = 'GitHub'
            url = 'https://github.com/MichaelZett/zettsystems-recipes/issues'
        }
    }
}
