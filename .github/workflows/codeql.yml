# CodeQL scans the code for security problems that a compiler and the usual
# static analysis do not see. Free for public repositories.
name: codeql

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Mondays at 05:00: the queries improve over time, so code that was clean
    # last month can be flagged today without anyone touching it.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Manual instead of autobuild: CodeQL only needs the compiled classes, not
      # the tests. Without the build cache: CodeQL reads the code by watching
      # javac, and classes taken from a cache would leave it with nothing.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-build-cache --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@v4
