import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'jacoco'
    id 'signing'
    id 'com.vanniktech.maven.publish' version "${vanniktechPublishVersion}"
    id 'io.github.ben-manes.versions' version "${benManesVersionsVersion}"
    id 'net.ltgt.errorprone' version "${errorproneGradleVersion}"
    id 'net.ltgt.nullaway' version "${nullawayGradleVersion}"
    id 'com.github.spotbugs' version "${spotbugsGradleVersion}"
    id 'org.sonarqube' version "${sonarVersion}"
}

// ErrorProne-Checks, die als Sicherheitsnetz auf ERROR stehen.
ext.errorproneEnforcedChecks = [
        'ArrayRecordComponent',
        'EmptyCatch',
        'EqualsGetClass',
        'FutureReturnValueIgnored',
        'InlineFormatString',
        'JavaTimeDefaultTimeZone',
        'JdkObsolete',
        'MissingOverride',
        'MixedMutabilityReturnType',
        'OperatorPrecedence',
        'ReferenceEquality',
        'StringSplitter',
        'SuperCallToObjectMethod',
        'UnnecessaryMethodReference',
]

repositories {
    mavenCentral()
}

// `group` and `version` come from gradle.properties
description = 'OpenRewrite recipes from ZettSystems.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = "${jacocoVersion}"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation platform("org.openrewrite.recipe:rewrite-recipe-bom:${rewriteRecipeBomVersion}")
    implementation 'org.openrewrite:rewrite-java'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // JSpecify is the annotation vocabulary, NullAway the compile-time check.
    // `compileOnly`, so consumers do not inherit it.
    compileOnly "org.jspecify:jspecify:${jspecifyVersion}"
    testCompileOnly "org.jspecify:jspecify:${jspecifyVersion}"

    errorprone "com.google.errorprone:error_prone_core:${errorproneCoreVersion}"
    errorprone "com.uber.nullaway:nullaway:${nullawayCoreVersion}"

    testImplementation('org.openrewrite:rewrite-test') {
        exclude group: 'org.slf4j', module: 'slf4j-nop'
    }
    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"

    // Parsers for the Java versions the test fixtures are written in.
    testRuntimeOnly 'org.openrewrite:rewrite-java-17'
    testRuntimeOnly 'org.openrewrite:rewrite-java-21'
    testRuntimeOnly 'org.openrewrite:rewrite-java-25'

    // An SLF4J binding, so parser warnings become visible while testing.
    testRuntimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testRuntimeOnly "com.google.guava:guava:${guavaVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

// ------------------------------------------------------ static analysis

tasks.named('compileJava') {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        nullaway {
            severity = CheckSeverity.ERROR
            annotatedPackages.add('de.zettsystems')
        }
        project.ext.errorproneEnforcedChecks.each { check -> error(check) }
    }
}

// Test sources are recipe fixtures: text blocks of deliberately unidiomatic Java.
tasks.named('compileTestJava') {
    options.errorprone.enabled = false
}

spotbugs {
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.html")
        }
        sarif {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.sarif")
        }
        xml.required = false
    }
}

// SpotBugs on test code is almost only noise here.
tasks.named('spotbugsTest') {
    enabled = false
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('jacocoTestReport')
    // The branches left uncovered are defensive guards a recipe cannot be fed from
    // valid Java: a method invocation without a receiver, an untyped expression.
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

sonar {
    properties {
        property 'sonar.projectKey', 'zettsystems-recipes'
        property 'sonar.projectName', 'zettsystems-recipes'
        property 'sonar.host.url', 'http://localhost:9000'
        def sonarTokenValue = findProperty('sonar.token') ?: System.getenv('SONAR_TOKEN')
        if (sonarTokenValue) {
            property 'sonar.token', sonarTokenValue
        }
        // java:S2699 wants an assertion per test. OpenRewrite's `rewriteRun(...)` is the
        // assertion — it compares the rewritten source against the expected one and fails
        // the test itself — but Sonar does not know the method, so every recipe test is
        // flagged. Nothing else in this project uses assertion-free tests.
        property 'sonar.issue.ignore.multicriteria', 's2699'
        property 'sonar.issue.ignore.multicriteria.s2699.ruleKey', 'java:S2699'
        property 'sonar.issue.ignore.multicriteria.s2699.resourceKey', '**/*Test.java'
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
    metaInf {
        from(file('LICENSE'))
    }
}

// The recipe is compiled against Java 17 so that it can be loaded by any build
// running on JDK 17 or newer. Only the tests use the full Java 25 language level.
tasks.named('compileJava') {
    options.release = 17
}

// ------------------------------------------------------ dependency updates

def depUpdateIsUnstable = { String version ->
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    def stable = stableKeywords.any { version.toUpperCase().contains(it) }
    def numericLooking = version ==~ /^[0-9,.v-]+(-r)?$/
    return !stable && !numericLooking
}
def depUpdateIsMajorBump = { String current, String candidate ->
    def cur = current.split(/[.\-]/, 2)[0]
    def cand = candidate.split(/[.\-]/, 2)[0]
    return cur.isInteger() && cand.isInteger() && cand.toInteger() > cur.toInteger()
}
dependencyUpdates {
    rejectVersionIf { selection ->
        def allowUnstable = project.hasProperty('unstable')
        def allowMajor = project.hasProperty('major')
        if (!allowUnstable
                && depUpdateIsUnstable(selection.candidate.version)
                && !depUpdateIsUnstable(selection.currentVersion)) {
            return true
        }
        if (!allowMajor
                && depUpdateIsMajorBump(selection.currentVersion, selection.candidate.version)) {
            return true
        }
        return false
    }
}

// ------------------------------------------------------ sign & publish

// Locally the GPG agent holds the key; CI hands the key in through
// `signingInMemoryKey`, which the publish plugin wires up on its own.
if (!project.hasProperty('signingInMemoryKey')) {
    signing {
        useGpgCmd()
    }
}

mavenPublishing {
    // Uploads to the Central Portal (https://central.sonatype.com). The bundle is
    // only validated, never released automatically — release it by hand in the
    // portal, or run `publishAndReleaseToMavenCentral` once that is trusted.
    publishToMavenCentral()
    signAllPublications()

    coordinates(group.toString(), 'zettsystems-recipes', version.toString())

    pom {
        name = 'zettsystems-recipes'
        description = project.description
        url = 'https://github.com/MichaelZett/zettsystems-recipes'
        inceptionYear = '2023'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'michaelzett'
                name = 'Michael Zoeller'
                email = 'michael2.zoeller@gmail.com'
                organization = 'ZettSystems'
                organizationUrl = 'https://zettsystems.de/'
            }
        }
        scm {
            url = 'https://github.com/MichaelZett/zettsystems-recipes'
            connection = 'scm:git:https://github.com/MichaelZett/zettsystems-recipes.git'
            developerConnection = 'scm:git:ssh://git@github.com/MichaelZett/zettsystems-recipes.git'
        }
        issueManagement {
            system = 'GitHub'
            url = 'https://github.com/MichaelZett/zettsystems-recipes/issues'
        }
    }
}
