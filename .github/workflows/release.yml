---
# Publishes the version from gradle.properties to Maven Central via the Central
# Portal. The upload only creates a deployment; releasing it stays a manual step
# in https://central.sonatype.com/publishing/deployments.
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  publisher token from the portal
#   SIGNING_KEY                                      `gpg --export-secret-keys --armor`
#   SIGNING_PASSWORD                                 passphrase of that key
name: publish

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"'
  GRADLE_SWITCHES: "-s --console=plain --stacktrace"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set-up-jdk
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle
      - name: publish-to-maven-central
        timeout-minutes: 30
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew ${GRADLE_SWITCHES} publishToMavenCentral
