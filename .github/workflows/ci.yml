---
# Builds every push and pull request. Whether the build is also released is
# decided by the version in gradle.properties, not by a separate trigger:
#
#   1.2.3-SNAPSHOT   build only
#   1.2.3            build, upload to Maven Central, tag v1.2.3 and cut a
#                    GitHub release with the CHANGELOG section as its notes
#
# So a release is "drop the -SNAPSHOT and push to master". Snapshots are never
# uploaded anywhere; use `./gradlew publishToMavenLocal` to consume them.
#
# The upload only creates a deployment; releasing it stays a manual step in
# https://central.sonatype.com/publishing/deployments. A version that is already
# on Central is skipped, so re-running the workflow is harmless.
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  publisher token from the portal
#   SIGNING_KEY                                      `gpg --export-secret-keys --armor`
#   SIGNING_PASSWORD                                 passphrase of that key
name: ci

on:
  push:
    branches:
      - master
    tags-ignore:
      - "*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"'
  GRADLE_SWITCHES: "-s --console=plain --stacktrace"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}
      already-published: ${{ steps.published.outputs.already-published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate-gradle-wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: set-up-jdk
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: build
        # `build` runs the tests plus ErrorProne/NullAway, SpotBugs and the JaCoCo thresholds.
        run: ./gradlew ${GRADLE_SWITCHES} build

      - name: upload-reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/spotbugs/
            build/reports/jacoco/
          retention-days: 7

      - name: version
        id: version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "${VERSION}" in
            *-SNAPSHOT) echo "is-release=false" >> "$GITHUB_OUTPUT"
                        echo "::notice::${VERSION} is a snapshot - building only." ;;
            *)          echo "is-release=true"  >> "$GITHUB_OUTPUT"
                        echo "::notice::${VERSION} is a release." ;;
          esac

      - name: check-changelog
        # Fails before anything is uploaded or tagged: the release job turns the
        # matching CHANGELOG section into the GitHub release notes.
        if: steps.version.outputs.is-release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FOUND=$(awk -v v="${VERSION}" '
            BEGIN { h = "## " v; n = length(h) }
            substr($0, 1, n) == h && (length($0) == n || substr($0, n + 1, 1) == " ") { print "yes"; exit }
          ' CHANGELOG.md)
          if [ -z "${FOUND}" ]; then
            echo "::error file=CHANGELOG.md::No '## ${VERSION}' section - rename '## Unreleased' before releasing."
            exit 1
          fi

      - name: check-already-published
        id: published
        if: steps.version.outputs.is-release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://repo1.maven.org/maven2/de/zettsystems/zettsystems-recipes/${VERSION}/zettsystems-recipes-${VERSION}.pom"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${URL}")
          if [ "${CODE}" = "200" ]; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION} is already on Maven Central - nothing to upload."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [build]
    if: >-
      github.event_name != 'pull_request'
      && needs.build.outputs.is-release == 'true'
      && needs.build.outputs.already-published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set-up-jdk
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: publish-to-maven-central
        timeout-minutes: 30
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew ${GRADLE_SWITCHES} publishToMavenCentral

      - name: tag-release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Tag v${VERSION} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

      - name: github-release
        # The release notes are the CHANGELOG section for this version, preceded
        # by the Central coordinates. No assets: the jars live on Central.
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} already exists."
            exit 0
          fi
          COORDS="de.zettsystems:zettsystems-recipes:${VERSION}"
          URL="https://central.sonatype.com/artifact/de.zettsystems/zettsystems-recipes/${VERSION}"
          NOTES="${RUNNER_TEMP}/notes.md"
          {
            printf 'Available on [Maven Central](%s): `%s`\n\n' "${URL}" "${COORDS}"
            # Prefix comparison rather than a regex: the dots in the version
            # would otherwise be metacharacters.
            awk -v v="${VERSION}" '
              BEGIN { h = "## " v; n = length(h) }
              !f && substr($0, 1, n) == h && (length($0) == n || substr($0, n + 1, 1) == " ") { f = 1; next }
              f && /^## / { exit }
              f
            ' CHANGELOG.md
          } > "${NOTES}"
          if [ "$(grep -c . "${NOTES}")" -lt 2 ]; then
            echo "::error::No CHANGELOG section for ${VERSION} - check-changelog should have caught this."
            exit 1
          fi
          gh release create "v${VERSION}" --title "${VERSION}" --notes-file "${NOTES}" --verify-tag
