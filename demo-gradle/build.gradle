plugins {
    id 'java'
    id 'org.openrewrite.rewrite' version '7.39.0'
}

repositories {
    // mavenLocal() first, so `./gradlew publishToMavenLocal` in the repo root can be
    // tried out before a version reaches Maven Central.
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation libs.guava

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher

    rewrite platform("org.openrewrite.recipe:rewrite-recipe-bom:3.37.0")
    rewrite 'org.openrewrite.recipe:rewrite-migrate-java'
    rewrite 'de.zettsystems:zettsystems-recipes:1.0.0'
}

rewrite {
    activeRecipe('org.openrewrite.java.migrate.UpgradeToJava17')
    // Ships with the recipe artifact; no local rewrite.yml needed.
    activeRecipe('de.zettsystems.UseToListTrue')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
